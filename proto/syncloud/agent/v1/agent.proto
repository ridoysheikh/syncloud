// Agent <-> controller protocol (plan §12). The agent dials out once and keeps
// a single bidirectional stream; commands and telemetry share it.
syntax = "proto3";

package syncloud.agent.v1;

option go_package = "syncloud/internal/gen/syncloud/agent/v1;agentv1";

service AgentGatewayService {
  // Connect is the long-lived agent stream. The first message must be Hello.
  // The node identity comes from the mTLS client certificate, not the messages.
  rpc Connect(stream ConnectRequest) returns (stream ConnectResponse);
}

message ConnectRequest {
  oneof msg {
    Hello hello = 1;
    Heartbeat heartbeat = 2;
    CommandResult result = 3;
    TaskStatus task_status = 4;
    RenewCertificate renew_certificate = 5;
    LogBatch logs = 6;
    ExecOutput exec_output = 7;
    UpgradeResult upgrade_result = 8;
  }
}

message ConnectResponse {
  oneof msg {
    Welcome welcome = 1;
    RunTask run_task = 2;
    StopTask stop_task = 3;
    NetworkConfig network = 4;
    CertificateIssued certificate = 5;
    ConfirmNetwork confirm_network = 6;
    Discovery discovery = 7;
    ExecInput exec_input = 8;
    PullImage pull_image = 9;
    UpgradeAgent upgrade_agent = 10;
  }
}

// UpgradeAgent streams a new agent binary in chunks (§5.0.1, §6.2). After
// the last chunk checks out against sha256 the agent replaces itself; a guard
// restores the old binary if the new one does not reconnect.
message UpgradeAgent {
  string version = 1;
  string sha256 = 2;
  int64 size = 3;
  int64 offset = 4;
  bytes data = 5;
  bool last = 6;
}

// UpgradeResult reports an agent upgrade that failed before the restart, or
// one rolled back by the guard (reported after reconnecting).
message UpgradeResult {
  string version = 1;
  string error = 2;
}

// PullImage asks a node to pull an image ahead of a deployment (§5.9
// pre-pull), so new tasks start without waiting for the download.
message PullImage {
  string image = 1;
  string registry_auth = 2; // X-Registry-Auth (short-lived)
  string registry_ca = 3;   // PEM to trust for the image's registry (self-signed, private networks)
}

message Hello {
  string agent_version = 1;
  NodeInfo info = 2;
  // Every SynCloud-managed container on the node, so the controller can
  // reconcile after a reconnect (§6.3).
  repeated TaskStatus tasks = 3;
}

message NodeInfo {
  string hostname = 1;
  string os = 2;              // e.g. "Ubuntu 24.04.1 LTS"
  string kernel = 3;
  string arch = 4;            // amd64, arm64
  int32 cpu_cores = 5;
  uint64 memory_bytes = 6;
  uint64 disk_bytes = 7;      // root filesystem size
  string docker_version = 8;  // empty when Docker is unavailable
  // Private networking (§8). The key is generated on the node.
  string wireguard_public_key = 9;
  // advertise_address is the address peers use to reach this node's
  // WireGuard port (--advertise-address). Empty: the controller uses the
  // address the node connects from.
  string advertise_address = 10;
}

message Welcome {
  string node_id = 1;
  // How often the agent should send heartbeats.
  int32 heartbeat_interval_seconds = 2;
}

message Heartbeat {
  NodeMetrics metrics = 1;
  NetworkStatus network = 2;
  repeated TaskMetrics tasks = 3; // samples taken since the last heartbeat (§9.1)
}

// TaskMetrics is one resource sample of a task's container. Byte counters
// are cumulative since the container started.
message TaskMetrics {
  string task_id = 1;
  string service_id = 2;
  string project = 3;
  string environment = 4;
  string service = 5;
  int64 at_unix_ms = 6;
  double cpu_percent = 7;          // 100 = one full core
  uint64 memory_bytes = 8;         // usage minus page cache
  uint64 memory_limit_bytes = 9;
  uint64 net_rx_bytes = 10;
  uint64 net_tx_bytes = 11;
  uint64 block_read_bytes = 12;
  uint64 block_write_bytes = 13;
}

message NodeMetrics {
  double cpu_percent = 1;
  uint64 memory_used_bytes = 2;
  uint64 memory_total_bytes = 3;
  uint64 disk_used_bytes = 4;
  uint64 disk_total_bytes = 5;
  double load1 = 6;
  double load5 = 7;
  double load15 = 8;
  uint64 net_rx_bytes = 9;    // cumulative, all non-loopback interfaces
  uint64 net_tx_bytes = 10;
  int64 uptime_seconds = 11;
}

message CommandResult {
  string command_id = 1;
  bool ok = 2;
  string error = 3;
}

// TaskSpec describes one container. The agent creates it idempotently: a
// container whose spec hash matches is left running; otherwise it is replaced.
message TaskSpec {
  string task_id = 1;           // stable ID, also the container label syncloud.task_id
  string name = 2;              // container name
  string image = 3;
  repeated string command = 4;  // overrides the image CMD when set
  map<string, string> env = 5;
  map<string, string> labels = 6;
  repeated PortBinding ports = 7;
  repeated Mount mounts = 8;
  string network_mode = 9;      // "host", or a Docker network name (created if missing)
  RestartPolicy restart = 10;
  int64 memory_limit_bytes = 11; // 0 = unlimited
  int64 nano_cpus = 12;          // 0 = unlimited; 1e9 = one CPU
  repeated string extra_hosts = 13; // "name:ip" or "name:host-gateway"
  bool system = 14;             // platform component (§5.0): never evicted by users
  repeated string dns_servers = 15; // the node's discovery DNS (§8.1)
  repeated string dns_search = 16;  // e.g. production.shop.syncloud.internal
  HealthCheck health = 17;      // probed by the agent (§5.6); unset = no check
  bool privileged = 19;         // only for platform builds (BuildKit, §5.8); never user-settable
  string registry_auth = 18;    // X-Registry-Auth for the pull (short-lived; not part of the spec hash)
  repeated string entrypoint = 20; // overrides the image ENTRYPOINT when set
  // registry_ca is a certificate to trust for the image's registry, when the
  // platform registry only has a self-signed one (§5.9; not part of the spec hash).
  string registry_ca = 21;
}

message PortBinding {
  string host_ip = 1;           // e.g. "127.0.0.1"; empty = all interfaces
  uint32 host_port = 2;
  uint32 container_port = 3;
  string protocol = 4;          // "tcp" (default) or "udp"
}

message Mount {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_VOLUME = 1;            // named Docker volume (node-local, D2)
    TYPE_BIND = 2;              // host path
  }
  Type type = 1;
  string source = 2;            // volume name or host path
  string target = 3;            // path in the container
  bool read_only = 4;
}

enum RestartPolicy {
  RESTART_POLICY_UNSPECIFIED = 0; // same as UNLESS_STOPPED
  RESTART_POLICY_NO = 1;
  RESTART_POLICY_ALWAYS = 2;
  RESTART_POLICY_UNLESS_STOPPED = 3;
  RESTART_POLICY_ON_FAILURE = 4;
}

message RunTask {
  string command_id = 1;
  TaskSpec spec = 2;
}

message StopTask {
  string command_id = 1;
  string task_id = 2;
  int32 timeout_seconds = 3;    // before SIGKILL
  bool remove = 4;              // also remove the container
}

enum TaskState {
  TASK_STATE_UNSPECIFIED = 0;
  TASK_STATE_PULLING = 1;
  TASK_STATE_STARTING = 2;
  TASK_STATE_RUNNING = 3;
  TASK_STATE_EXITED = 4;
  TASK_STATE_FAILED = 5;        // could not be created/started (see error)
  TASK_STATE_REMOVED = 6;
}

message TaskStatus {
  string task_id = 1;
  TaskState state = 2;
  string container_id = 3;
  string image = 4;
  string health = 5;            // Docker health: "", starting, healthy, unhealthy
  int32 exit_code = 6;
  string error = 7;
  int64 started_at_unix = 8;
  string spec_hash = 9;
  string ip = 10;               // address on the task's network (the "syncloud" network for services)
}

// NetworkConfig is this node's view of the WireGuard mesh (§8). It is sent
// after Welcome and again whenever a node joins, leaves or changes address.
message NetworkConfig {
  uint64 generation = 1;
  string node_address = 2;      // e.g. "10.90.0.5/16" for the WireGuard interface
  string container_subnet = 3;  // e.g. "10.91.5.0/24" for the Docker network "syncloud"
  uint32 listen_port = 4;       // WireGuard UDP port
  repeated Peer peers = 5;
  string mesh_cidr = 6;         // 10.90.0.0/16
  string container_cidr = 7;    // 10.91.0.0/16
  string service_cidr = 8;      // 10.92.0.0/16 (VIPs, §8.6)
  Firewall firewall = 9;        // host firewall (§8.3); unset = no host firewall
}

// Firewall is the node's inbound policy for its public interfaces. The mesh,
// loopback, Docker bridges, established traffic and essential ICMP are always
// allowed; everything else is dropped unless a rule allows it.
message Firewall {
  repeated FirewallRule rules = 1;
  // Addresses of cluster nodes (WireGuard endpoints), for "cluster" sources.
  repeated string cluster_sources = 2;
  // A config whose firewall differs from the last confirmed one must be
  // confirmed (ConfirmNetwork) within this many seconds, or the agent rolls back.
  uint32 confirm_timeout_seconds = 3;
}

message FirewallRule {
  string id = 1;                // policy ID + index, used in counters
  string protocol = 2;          // tcp, udp, icmp, any
  string ports = 3;             // "22", "8000-8100", "" (all)
  repeated string sources = 4;  // CIDRs; "cluster" = cluster nodes; empty = anywhere
  string description = 5;
}

// ConfirmNetwork tells the agent the controller still hears it after it
// applied this generation (commit-confirm, §8.3).
message ConfirmNetwork {
  uint64 generation = 1;
}

message Peer {
  string node_id = 1;
  string name = 2;
  string public_key = 3;
  string endpoint = 4;          // host:port
  repeated string allowed_ips = 5;
}

message NetworkStatus {
  uint64 generation = 1;        // last NetworkConfig applied
  string error = 2;             // why the last apply failed
  string mode = 3;              // "kernel" or "userspace" WireGuard
  repeated PeerStatus peers = 4;
  bool firewall_pending = 5;    // applied, waiting for ConfirmNetwork
  uint64 drift_corrections = 6; // times the managed ruleset was changed by hand and restored
  repeated RuleCounter counters = 7; // per firewall rule, cumulative since the agent started (§8.3)
  repeated DropFlow drops = 8;       // flows dropped since the last heartbeat
  string security_error = 9;         // why security groups are not enforced on this node
}

message RuleCounter {
  string id = 1;                // rule comment: host rule ID, "<group>:<in|out>:<n>" or a built-in name
  uint64 packets = 2;
  uint64 bytes = 3;
}

// DropFlow is a connection attempt a default deny dropped, aggregated by
// source, destination, protocol and port.
message DropFlow {
  string direction = 1;         // host (public interface) | in (to a container) | out (from a container)
  string src = 2;
  string dst = 3;
  string protocol = 4;          // tcp | udp
  uint32 port = 5;
  uint64 packets = 6;
}

message PeerStatus {
  string public_key = 1;
  int64 last_handshake_unix = 2;
  uint64 rx_bytes = 3;
  uint64 tx_bytes = 4;
  string endpoint = 5;          // as seen by WireGuard (may differ behind NAT)
  double rtt_ms = 6;            // TCP probe to the peer's node address; 0 = unknown
}

// RenewCertificate asks for a new node certificate for a freshly generated
// key, before the current one expires (certificates last 90 days).
message RenewCertificate {
  string csr = 1;               // PEM CERTIFICATE REQUEST
}

message CertificateIssued {
  string certificate = 1;       // PEM; the previous certificate stays valid until the agent reconnects with this one
}

// LogBatch carries container output (§9.2). Labels (project, service, …) are
// added by the controller from the task ID.
message LogBatch {
  repeated LogLine lines = 1;
  uint64 dropped = 2;           // lines dropped on the node since the last batch (buffer full)
}

message LogLine {
  string task_id = 1;
  int64 time_unix_nano = 2;
  string stream = 3;            // stdout | stderr
  string line = 4;
}

// Discovery is the cluster's service directory (§8.1, §8.6): DNS records and
// virtual IPs with their backends. Sent in full whenever it changes.
message Discovery {
  uint64 generation = 1;
  repeated DNSRecord records = 2;
  repeated VirtualService services = 3;
  SecurityPolicy security = 4;  // unset: security groups are off
}

// SecurityPolicy is the compiled form of every security group (§8.3):
// sets of task IPs and allow rules between them. Each agent enforces the
// rules for traffic to and from its local containers.
message SecurityPolicy {
  repeated SecuritySet sets = 1;
  repeated SecurityRule rules = 2;
  repeated string platform_ips = 3; // always allowed in: the nodes' mesh addresses (Traefik, health checks)
}

message SecuritySet {
  string name = 1;              // nftables set name
  repeated string ips = 2;      // known members on every node
  // Local containers join when their labels match one of these, so new
  // tasks are classified before the controller hears of them:
  // "svc:<service ID>", "env:<project>/<env>", "proj:<project>",
  // "standalone:<project>[/<env>]" (job runs without a service).
  repeated string match = 3;
}

message SecurityRule {
  string id = 1;                // "<group ID>:<in|out>:<n>", for counters
  string direction = 2;         // in | out
  string local_set = 3;         // the members the rule is for
  repeated string peer_sets = 4;
  repeated string peer_cidrs = 5;
  string protocol = 6;          // tcp | udp | icmp | any
  string ports = 7;             // "", "8080" or "8000-8100"
}

message DNSRecord {
  string name = 1;              // fully qualified, lowercase, no trailing dot
  repeated string ips = 2;
}

message VirtualService {
  string id = 1;                // service ID (used in nftables chain names)
  string vip = 2;
  repeated VirtualPort ports = 3;
}

message VirtualPort {
  string protocol = 1;          // tcp | udp
  uint32 port = 2;
  repeated string backends = 3; // ip:port of running tasks
}

// Interactive exec into a task container (§10, kubectl exec). Sessions are
// multiplexed on the agent stream by session_id.
message ExecInput {
  string session_id = 1;
  oneof msg {
    ExecStart start = 2;
    bytes stdin = 3;
    ExecResize resize = 4;
    bool close = 5;             // controller side went away: kill the session
    bool stdin_eof = 6;         // no more input: close the command's stdin
  }
}

message ExecStart {
  string task_id = 1;
  repeated string command = 2;  // default: sh
  bool tty = 3;
  uint32 cols = 4;
  uint32 rows = 5;
}

message ExecResize {
  uint32 cols = 1;
  uint32 rows = 2;
}

message ExecOutput {
  string session_id = 1;
  bytes data = 2;               // stdout (and stderr when tty)
  bool exited = 3;
  int32 exit_code = 4;
  string error = 5;             // could not start
}

// HealthCheck is probed by the agent against the task's IP (§5.6, layer 1).
// The task is "starting" until the first success, "unhealthy" after
// `retries` consecutive failures (failures during the start period do not
// count), and "healthy" again after one success.
message HealthCheck {
  string type = 1;              // http | tcp | cmd
  string path = 2;              // http: request path
  uint32 port = 3;              // http, tcp: container port
  repeated string command = 4;  // cmd: run in the container; exit 0 = healthy
  uint32 interval_seconds = 5;
  uint32 timeout_seconds = 6;
  uint32 retries = 7;
  uint32 start_period_seconds = 8;
}
