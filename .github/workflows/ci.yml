name: ci

# Checks only: releases are built locally and published with
# scripts/release.sh (docs/development/releasing.md).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal sdk tools)" || (gofmt -l cmd internal sdk tools; exit 1)
      - run: go vet ./...
      # Includes the OpenAPI ↔ routes and OpenAPI ↔ synctl parity checks (§5.1).
      - run: go test -race -timeout 5m ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
